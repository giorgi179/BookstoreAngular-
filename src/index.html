       STRUCTURED DATA — JSON-LD
       (BookStore + Organization + WebSite with SearchAction)
  ═══════════════════════════════════════════ -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://yoursite.com/#organization",
        "name": "BINK. Publishers",
        "url": "https://yoursite.com/",
        "logo": {
          "@type": "ImageObject",
          "url": "https://img.freepik.com/premium-photo/flat-book-logo-template-collection-creative-design_573056-7836.jpg",
          "width": 512,
          "height": 512
        },
        "sameAs": [
          "https://www.facebook.com/binkpublishers",
          "https://www.instagram.com/binkpublishers",
          "https://twitter.com/BINKPublishers",
          "https://www.linkedin.com/company/binkpublishers"
        ],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "availableLanguage": ["English", "Georgian", "Russian"]
        }
      },
      {
        "@type": "WebSite",
        "@id": "https://yoursite.com/#website",
        "url": "https://yoursite.com/",
        "name": "BINK. Publishers",
        "description": "Discover and buy bestselling books online. Curated fiction, non-fiction, children's books and more.",
        "publisher": {
          "@id": "https://yoursite.com/#organization"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://yoursite.com/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        },
        "inLanguage": ["en", "ka", "ru", "de", "fr", "tr"]
      },
      {
        "@type": "BookStore",
        "@id": "https://yoursite.com/#bookstore",
        "name": "BINK. Publishers",
        "url": "https://yoursite.com/",
        "description": "BINK. Publishers is an online bookstore offering a wide selection of bestselling and recommended books across all genres.",
        "image": "https://img.freepik.com/premium-photo/flat-book-logo-template-collection-creative-design_573056-7836.jpg",
        "priceRange": "$$",
        "currenciesAccepted": "USD, EUR, GEL",
        "paymentAccepted": "Credit Card, Debit Card, PayPal",
        "openingHours": "Mo-Su 00:00-24:00",
        "hasMap": "https://maps.google.com/",
        "sameAs": "https://yoursite.com/#organization"
      },
      {
        "@type": "WebPage",
        "@id": "https://yoursite.com/#webpage",
        "url": "https://yoursite.com/",
        "name": "BINK. Publishers | Bestselling Books Online – Buy, Discover & Read",
        "description": "Discover bestselling books at BINK Publishers. Browse thousands of curated titles: fiction, non-fiction, children's books and more.",
        "isPartOf": {
          "@id": "https://yoursite.com/#website"
        },
        "about": {
          "@id": "https://yoursite.com/#bookstore"
        },
        "breadcrumb": {
          "@type": "BreadcrumbList",
          "itemListElement": [
            {
              "@type": "ListItem",
              "position": 1,
              "name": "Home",
              "item": "https://yoursite.com/"
            }
          ]
        },
        "inLanguage": "en",
        "speakable": {
          "@type": "SpeakableSpecification",
          "cssSelector": ["h1", ".hero-description"]
        }
      }
    ]
  }
