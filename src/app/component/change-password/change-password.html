<div class="cp-page">
  <div class="cp-card">

    <button class="back-btn" (click)="goBack()">{{ 'BACK' | translate }}</button>
    <h1 class="page-title">{{ 'CHANGE_PASSWORD' | translate }}</h1>
    <div class="divider"></div>

    <div class="success-msg" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="error-msg" *ngIf="errorMessage">{{ errorMessage }}</div>

    <div class="fields-group">
      <div class="field">
        <label>{{ 'CURRENT_PASSWORD' | translate }}</label>
        <div class="input-wrap">
          <input type="password" [(ngModel)]="oldPassword" [placeholder]="'CURRENT_PASSWORD' | translate"/>
        </div>
      </div>

      <div class="field">
        <label>{{ 'NEW_PASSWORD' | translate }}</label>
        <div class="input-wrap">
          <input type="password" [(ngModel)]="newPassword" [placeholder]="'NEW_PASSWORD' | translate"/>
        </div>
      </div>

      <div class="field">
        <label>{{ 'CONFIRM_PASSWORD' | translate }}</label>
        <div class="input-wrap">
          <input type="password" [(ngModel)]="confirmPassword" [placeholder]="'CONFIRM_PASSWORD' | translate"/>
        </div>
      </div>
    </div>

    <button class="submit-btn" (click)="submit()" [disabled]="isLoading">
      {{ isLoading ? ('SAVING' | translate) : ('SAVE_PASSWORD' | translate) }}
    </button>

  </div>
</div>
